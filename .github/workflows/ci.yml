name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Native vision uses only the Python standard library. The bounded smoke
      # test starts the real detector, bridge and server with a temporary DB.
      - run: npm ci
      - run: npm run check:native
