name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub defers a draft release's tag until publication. Create it now
      # so the installers can check out the exact release commit.
      - name: Tag the draft release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1 || \
            gh api "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA"

  installers:
    needs: release
    if: needs.release.outputs.created == 'true'
    # Tags created with GITHUB_TOKEN do not trigger push workflows. Call the
    # installer workflow directly instead of relying on another event.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish: true
