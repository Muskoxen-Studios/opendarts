<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Darts</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0c0e12;
        color: #8b93a1;
        font: 400 0.95rem system-ui, sans-serif;
      }
      .board {
        width: 64px; height: 64px; margin: 0 auto 1.2rem;
        border-radius: 50%;
        border: 6px solid #20242b;
        border-top-color: #d8453f;
        animation: spin 1.1s linear infinite;
      }
      h1 { margin: 0 0 0.4rem; font-size: 1.1rem; color: #e8e6e1; letter-spacing: 0.02em; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .board { animation: none; } }
    </style>
  </head>
  <body>
    <div>
      <div class="board"></div>
      <h1>Darts</h1>
      <p>Starting the game server&hellip;</p>
    </div>
  </body>
</html>
